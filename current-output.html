<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#075a96">
<title>現時点の出来高算出</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#15171a;--sub:#667085;
  --line:#d9dee5;--blue:#1976d2;--green:#0b8f72;
  --input:#fff200;--time:#fff4cc;--result:#eef6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,input{touch-action:manipulation}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px 40px}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:24px;margin:0}
.back{
  margin-left:auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:8px 11px;
  border-radius:10px;
  background:#1976d2;
  color:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:800;
}
.note{color:var(--sub);font-size:13px;margin-bottom:18px}
.card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 16px rgba(0,0,0,.07);
}
.field{margin-bottom:16px}
.field-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
label{display:block;font-weight:700;margin-bottom:7px;font-size:15px}
input{
  width:100%;
  min-width:0;
  font-size:22px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  background:#fff;
}
#calcTime{background:var(--time)}
#production{background:var(--input)}
.now-btn{
  min-height:51px;
  border:0;
  border-radius:10px;
  background:#e3edf8;
  color:#174d7d;
  padding:0 14px;
  font-size:14px;
  font-weight:800;
}
.results{
  margin-top:20px;
  border-top:1px solid var(--line);
  padding-top:18px;
  display:grid;
  gap:12px;
}
.result{
  background:var(--result);
  border-radius:12px;
  padding:14px;
}
.result .name{font-size:14px;color:var(--sub);margin-bottom:4px}
.result .value{font-size:30px;font-weight:800}
.result .suffix{font-size:14px;color:var(--sub);margin-left:5px}
.formula{
  margin-top:14px;
  font-size:12px;
  color:var(--sub);
  line-height:1.6;
}
@media(max-width:380px){
  h1{font-size:21px}
  .back{font-size:11px;padding:7px 8px}
  .field-row{grid-template-columns:1fr}
  .now-btn{width:100%}
}

/* ===== 時刻入力と現在時刻ボタンの重なり修正 ===== */
.field-row{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) 118px !important;
  gap:10px !important;
  align-items:end !important;
}
.field-row > *{
  min-width:0 !important;
}
#calcTime{
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
}
.now-btn{
  width:118px !important;
  min-width:118px !important;
  max-width:118px !important;
  padding:0 8px !important;
  white-space:nowrap !important;
}

@media(max-width:420px){
  .field-row{
    grid-template-columns:minmax(0,1fr) 108px !important;
    gap:8px !important;
  }
  .now-btn{
    width:108px !important;
    min-width:108px !important;
    max-width:108px !important;
    font-size:13px !important;
  }
}


#progress{
  background:#fff;
}
.progress-note{
  margin-top:6px;
  color:var(--sub);
  font-size:12px;
}
.compare-wrap{
  margin-top:20px;
  border-top:1px solid var(--line);
  padding-top:18px;
}
.compare-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
.compare-table th,
.compare-table td{
  border:1px solid var(--line);
  text-align:center;
  padding:11px 6px;
  font-variant-numeric:tabular-nums;
}
.compare-table thead th{
  background:#f3f6f9;
  font-size:14px;
}
.compare-table thead th:first-child{
  background:#fff;
}
.compare-table tbody th{
  width:24%;
  background:#f8fafc;
  text-align:left;
  font-size:14px;
}
.compare-table td strong{
  font-size:22px;
}
.compare-table .target-col,
.compare-table .diff-col{
  display:none;
}
.compare-table.show-target .target-col,
.compare-table.show-target .diff-col{
  display:table-cell;
}
.diff-negative{color:#b42318}
.diff-positive{color:#1769aa}
@media(max-width:420px){
  .compare-table th,
  .compare-table td{
    padding:10px 4px;
  }
  .compare-table td strong{
    font-size:20px;
  }
}


/* iPhone: 時刻欄と現在時刻ボタンを重ねない */
.field-row{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) 108px !important;
  gap:8px !important;
  align-items:end !important;
}
.field-row > *{min-width:0 !important}
#calcTime{
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
  padding-left:8px !important;
  padding-right:8px !important;
}
.now-btn{
  width:108px !important;
  min-width:108px !important;
  max-width:108px !important;
  padding:0 6px !important;
  white-space:nowrap !important;
}

/* 進度：iPhone標準数字キーボードではなく専用テンキー */
.progress-entry{
  width:100%;min-height:52px;padding:10px 14px;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  font-size:22px;color:#999;
}
.progress-entry.has-value{color:var(--text);font-weight:700}
.progress-pad{
  margin-top:10px;padding:10px;background:#111;border-radius:14px;
}
.progress-pad[hidden]{display:none}
.progress-pad-display{
  min-height:44px;padding:5px 10px 10px;color:#fff;text-align:right;
  font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;
}
.progress-pad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.progress-pad button{
  min-height:48px;border:0;border-radius:24px;background:#333;color:#fff;
  font-size:20px;font-weight:700;
}
.progress-pad button.fn{background:#666}
.progress-pad button.sign{background:#1976d2}
.progress-pad button.done{background:#ff9f0a}
@media(max-width:360px){
  .field-row{grid-template-columns:minmax(0,1fr) 100px !important}
  .now-btn{width:100px !important;min-width:100px !important;max-width:100px !important;font-size:12px !important}
}


/* ===== 時刻欄 iPhone重なり完全修正 ===== */
.field-row{display:grid !important;grid-template-columns:1fr !important;gap:8px !important;width:100% !important}
#calcTime{display:block !important;width:100% !important;min-width:0 !important;max-width:100% !important;box-sizing:border-box !important}
.now-btn{display:block !important;width:100% !important;min-width:0 !important;max-width:none !important;min-height:46px !important}


/* ===== 横並びレイアウト最終調整 ===== */

/* 時刻：入力欄＋現在時刻ボタン */
.field-row{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) 112px !important;
  gap:8px !important;
  align-items:end !important;
  width:100% !important;
}
.field-row > *{min-width:0 !important}

#calcTime{
  display:block !important;
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
  box-sizing:border-box !important;
  padding-left:6px !important;
  padding-right:6px !important;
  font-size:20px !important;
}

.now-btn{
  display:block !important;
  width:112px !important;
  min-width:112px !important;
  max-width:112px !important;
  min-height:51px !important;
  padding:0 6px !important;
  white-space:nowrap !important;
  font-size:13px !important;
}

/* 生産台数＋進度を横並び */
.production-progress-row{
  display:grid !important;
  grid-template-columns:1fr 1fr !important;
  gap:10px !important;
  align-items:start !important;
  margin-bottom:0 !important;
}
.production-progress-row .field{
  min-width:0 !important;
  margin-bottom:0 !important;
}
.production-progress-row label{
  white-space:nowrap !important;
}
.production-progress-row #production,
.production-progress-row .progress-entry{
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
  height:52px !important;
  box-sizing:border-box !important;
}

/* 進度テンキーは横並び欄の下で全幅表示 */
#progressPad{
  margin-top:10px !important;
  margin-bottom:12px !important;
}

@media(max-width:380px){
  .field-row{
    grid-template-columns:minmax(0,1fr) 104px !important;
    gap:6px !important;
  }
  .now-btn{
    width:104px !important;
    min-width:104px !important;
    max-width:104px !important;
    font-size:12px !important;
  }
  #calcTime{
    font-size:18px !important;
  }
  .production-progress-row{
    grid-template-columns:1fr 1fr !important;
    gap:8px !important;
  }
}


/* iPhone時刻欄：Safari内部UIを枠内に固定 */
.field-row{grid-template-columns:minmax(0,1fr) 112px !important;gap:8px !important}
#calcTime{
  width:100% !important; min-width:0 !important; max-width:100% !important;
  height:52px !important; box-sizing:border-box !important;
  overflow:hidden !important; font-size:18px !important;
}
.now-btn{width:112px !important;min-width:112px !important;max-width:112px !important;height:52px !important}

/* 生産台数を専用電卓入力に */
.production-entry{
  width:100%;height:52px;padding:10px 14px;text-align:left;
  background:#fff200;border:1px solid #d9ca00;border-radius:10px;
  font-size:22px;color:#999;
}
.production-entry.has-value{color:var(--text);font-weight:700}


/* ===== 今回のレイアウト調整 ===== */

/* 時刻入力欄と現在時刻ボタンを完全に半々 */
.field-row{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;
  gap:8px !important;
  width:100% !important;
}
#calcTime,
.now-btn{
  width:100% !important;
  min-width:0 !important;
  max-width:none !important;
  box-sizing:border-box !important;
}
.now-btn{
  height:52px !important;
  min-height:52px !important;
}

/* 進度の例を必ず1行表示 */
.progress-note{
  white-space:nowrap !important;
  word-break:keep-all !important;
  overflow-wrap:normal !important;
  font-size:11px !important;
  letter-spacing:-0.2px !important;
}

</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <h1>現時点の出来高算出</h1>
    <a class="back" href="index.html">出来高計算へ戻る</a>
  </div>
  <div class="note">8:25から現在時刻までの実働時間で出来高と個当り工数を算出します。</div>

  <div class="card">
    <div class="field">
      <label for="calcTime">時刻</label>
      <div class="field-row">
        <input id="calcTime" type="time" step="60">
        <button id="nowBtn" class="now-btn" type="button">現在時刻</button>
      </div>
    </div>

    <div class="production-progress-row">
<div class="field">
      <label for="production">生産台数</label>
      <button id="productionEntry" class="production-entry" type="button">入力</button><input id="production" type="hidden" value="">
    </div>
<div class="field">
      <label for="progress">進度</label>
      <button id="progressEntry" class="progress-entry" type="button">空欄OK</button>
      <input id="progress" type="hidden" value="">
      <div class="progress-note">例：-9 ＝ 9個遅れ、+5 ＝ 5個進み</div>
    </div>
    </div>

      <div id="productionPad" class="progress-pad" hidden>
  <div id="productionPadDisplay" class="progress-pad-display">0</div>
  <div class="progress-pad-grid">
    <button type="button" data-qkey="7">7</button><button type="button" data-qkey="8">8</button><button type="button" data-qkey="9">9</button><button type="button" class="fn" data-qkey="back">⌫</button>
    <button type="button" data-qkey="4">4</button><button type="button" data-qkey="5">5</button><button type="button" data-qkey="6">6</button><button type="button" class="fn" data-qkey="clear">C</button>
    <button type="button" data-qkey="1">1</button><button type="button" data-qkey="2">2</button><button type="button" data-qkey="3">3</button><button type="button" data-qkey=".">.</button>
    <button type="button" data-qkey="0" style="grid-column:span 2">0</button><button type="button" class="done" data-qkey="done" style="grid-column:span 2">決定</button>
  </div>
</div>
<div id="progressPad" class="progress-pad" hidden>
        <div id="progressPadDisplay" class="progress-pad-display">0</div>
        <div class="progress-pad-grid">
          <button type="button" data-pkey="7">7</button>
          <button type="button" data-pkey="8">8</button>
          <button type="button" data-pkey="9">9</button>
          <button type="button" class="fn" data-pkey="back">⌫</button>
          <button type="button" data-pkey="4">4</button>
          <button type="button" data-pkey="5">5</button>
          <button type="button" data-pkey="6">6</button>
          <button type="button" class="sign" data-pkey="sign">＋/−</button>
          <button type="button" data-pkey="1">1</button>
          <button type="button" data-pkey="2">2</button>
          <button type="button" data-pkey="3">3</button>
          <button type="button" class="fn" data-pkey="clear">C</button>
          <button type="button" data-pkey="0">0</button>
          <button type="button" data-pkey=".">.</button>
          <button type="button" class="done" data-pkey="done" style="grid-column:span 2">決定</button>
        </div>
      </div>
    <div class="compare-wrap">
      <table class="compare-table">
        <thead>
          <tr>
            <th></th>
            <th>現時点</th>
            <th class="target-col">目標</th>
            <th class="diff-col">差</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>出来高</th>
            <td><strong id="rate">0.0</strong></td>
            <td class="target-col"><strong id="targetRate">－</strong></td>
            <td class="diff-col"><strong id="rateDiff">－</strong></td>
          </tr>
          <tr>
            <th>個当り</th>
            <td><strong id="unitTime">0.0</strong></td>
            <td class="target-col"><strong id="targetUnitTime">－</strong></td>
            <td class="diff-col"><strong id="unitDiff">－</strong></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="formula">
      現時点 ＝ 生産台数から算出<br>
      目標生産数 ＝ 生産台数 − 進度<br>
      ※進度が空欄の場合は「現時点」のみ表示<br>
      ※休憩時間は自動で除外
    </div>
  </div>
</div>

<script>
const SHIFT_START = 8*60+25;
const BREAKS = [
  ['08:15','08:25'],['10:15','10:25'],['12:15','13:00'],['15:00','15:10'],
  ['17:10','17:20'],['19:20','19:30'],['20:15','20:25'],['22:15','22:25'],
  ['00:15','01:00'],['03:00','03:10'],['05:10','05:20'],['07:20','07:30']
];

const calcTime=document.getElementById('calcTime');
const production=document.getElementById('production');
const progress=document.getElementById('progress');
const rate=document.getElementById('rate');
const unitTime=document.getElementById('unitTime');
const targetRate=document.getElementById('targetRate');
const targetUnitTime=document.getElementById('targetUnitTime');
const rateDiff=document.getElementById('rateDiff');
const unitDiff=document.getElementById('unitDiff');
const compareTable=document.querySelector('.compare-table');

const mins=t=>{
  if(!t) return NaN;
  const [h,m]=t.split(':').map(Number);
  return h*60+m;
};

function elapsedWithoutBreaks(start,end){
  let total=end-start,rest=0;
  for(let day=-1;day<=2;day++){
    for(const [a,b] of BREAKS){
      let bs=mins(a)+day*1440;
      let be=mins(b)+day*1440;
      if(be<=bs) be+=1440;
      rest+=Math.max(0,Math.min(end,be)-Math.max(start,bs));
    }
  }
  return Math.max(0,total-rest);
}

function endMinutesFromTime(v){
  if(!v) return NaN;
  let end=mins(v);
  while(end<=SHIFT_START) end+=1440;
  return end;
}

function trunc1(n){
  if(!Number.isFinite(n)) return "0.0";
  const corrected=Number(n.toFixed(10));
  return (Math.trunc(corrected*10)/10).toFixed(1);
}

function setDiffClass(el,n){
  el.classList.remove('diff-negative','diff-positive');
  if(!Number.isFinite(n)) return;
  if(n<0) el.classList.add('diff-negative');
  if(n>0) el.classList.add('diff-positive');
}

function calculate(){
  const qty=parseFloat(production.value);
  const progressRaw=progress.value.trim();
  const prog=progressRaw==='' ? NaN : parseFloat(progressRaw);
  const end=endMinutesFromTime(calcTime.value);
  const activeMin=Number.isFinite(end) ? elapsedWithoutBreaks(SHIFT_START,end) : 0;

  const validCurrent=Number.isFinite(qty) && qty>0 && activeMin>0;

  let currentRate=NaN;
  let currentUnit=NaN;

  if(validCurrent){
    currentRate=qty/activeMin*60;
    currentUnit=activeMin*60/qty;
    rate.textContent=trunc1(currentRate);
    unitTime.textContent=trunc1(currentUnit);
  }else{
    rate.textContent='0.0';
    unitTime.textContent='0.0';
  }

  const hasProgress=progressRaw!=='' && Number.isFinite(prog);
  compareTable.classList.toggle('show-target',hasProgress);

  if(!hasProgress){
    targetRate.textContent='－';
    targetUnitTime.textContent='－';
    rateDiff.textContent='－';
    unitDiff.textContent='－';
    return;
  }

  const targetQty=Number.isFinite(qty) ? qty-prog : NaN;

  if(!validCurrent || !Number.isFinite(targetQty) || targetQty<=0){
    targetRate.textContent='－';
    targetUnitTime.textContent='－';
    rateDiff.textContent='－';
    unitDiff.textContent='－';
    return;
  }

  const tRate=targetQty/activeMin*60;
  const tUnit=activeMin*60/targetQty;
  const dRate=currentRate-tRate;
  const dUnit=currentUnit-tUnit;

  targetRate.textContent=trunc1(tRate);
  targetUnitTime.textContent=trunc1(tUnit);
  rateDiff.textContent=trunc1(dRate);
  unitDiff.textContent=trunc1(dUnit);

  setDiffClass(rateDiff,dRate);
  setDiffClass(unitDiff,dUnit);
}

function setNow(){
  const d=new Date();
  calcTime.value=
    String(d.getHours()).padStart(2,'0')+':'+
    String(d.getMinutes()).padStart(2,'0');
  calculate();
}

document.getElementById('nowBtn').addEventListener('click',setNow);
calcTime.addEventListener('input',calculate);
production.addEventListener('input',calculate);
progress.addEventListener('input',calculate);
setNow();

// 進度専用テンキー（マイナス入力対応）
(function(){
  const progress=document.getElementById('progress');
  const entry=document.getElementById('progressEntry');
  const pad=document.getElementById('progressPad');
  const disp=document.getElementById('progressPadDisplay');
  let buf='';

  function paint(){
    disp.textContent=buf || '0';
    entry.textContent=buf || '空欄OK';
    entry.classList.toggle('has-value',buf!=='');
  }
  function commit(){
    progress.value=buf;
    progress.dispatchEvent(new Event('input',{bubbles:true}));
  }

  entry.addEventListener('click',()=>{
    buf=progress.value || '';
    paint();
    pad.hidden=false;
  });

  pad.querySelectorAll('[data-pkey]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const k=btn.dataset.pkey;
      if(/^\d+$/.test(k)){
        if(buf==='0') buf=k;
        else if(buf==='-0') buf='-'+k;
        else buf+=k;
      }else if(k==='sign'){
        if(buf.startsWith('-')) buf=buf.slice(1);
        else buf='-'+buf;
      }else if(k==='back'){
        buf=buf.slice(0,-1);
      }else if(k==='clear'){
        buf='';
      }else if(k==='done'){
        commit();
        paint();
        pad.hidden=true;
        return;
      }
      commit();
      paint();
    });
  });
  paint();
})();


(function(){
 const h=document.getElementById('production'), e=document.getElementById('productionEntry'),
       p=document.getElementById('productionPad'), d=document.getElementById('productionPadDisplay');
 if(!h||!e||!p||!d)return;
 let b='';
 const draw=()=>{d.textContent=b||'0';e.textContent=b||'入力';e.classList.toggle('has-value',!!b)};
 const fire=()=>{h.value=b;h.dispatchEvent(new Event('input',{bubbles:true}));h.dispatchEvent(new Event('change',{bubbles:true}))};
 e.onclick=()=>{b=h.value||'';draw();p.hidden=false;const x=document.getElementById('progressPad');if(x)x.hidden=true};
 p.querySelectorAll('[data-qkey]').forEach(x=>x.onclick=()=>{
   const k=x.dataset.qkey;
   if(/^\d$/.test(k)){b=b==='0'?k:b+k}
   else if(k==='.'){if(!b.includes('.'))b=(b||'0')+'.'}
   else if(k==='back')b=b.slice(0,-1);
   else if(k==='clear')b='';
   else if(k==='done'){fire();draw();p.hidden=true;return}
   fire();draw();
 });
 draw();
})();

</script>
</body>
</html>
