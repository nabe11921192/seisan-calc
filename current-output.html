<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#075a96">
<title>現時点の出来高算出</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--text:#15171a;--sub:#667085;
  --line:#d9dee5;--blue:#1976d2;--green:#0b8f72;
  --input:#fff200;--time:#fff4cc;--result:#eef6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,input{touch-action:manipulation}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px 40px}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:24px;margin:0}
.back{
  margin-left:auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:8px 11px;
  border-radius:10px;
  background:#1976d2;
  color:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:800;
}
.note{color:var(--sub);font-size:13px;margin-bottom:18px}
.card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 16px rgba(0,0,0,.07);
}
.field{margin-bottom:16px}
.field-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
label{display:block;font-weight:700;margin-bottom:7px;font-size:15px}
input{
  width:100%;
  min-width:0;
  font-size:22px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  background:#fff;
}
#calcTime{background:var(--time)}
#production{background:var(--input)}
.now-btn{
  min-height:51px;
  border:0;
  border-radius:10px;
  background:#e3edf8;
  color:#174d7d;
  padding:0 14px;
  font-size:14px;
  font-weight:800;
}
.results{
  margin-top:20px;
  border-top:1px solid var(--line);
  padding-top:18px;
  display:grid;
  gap:12px;
}
.result{
  background:var(--result);
  border-radius:12px;
  padding:14px;
}
.result .name{font-size:14px;color:var(--sub);margin-bottom:4px}
.result .value{font-size:30px;font-weight:800}
.result .suffix{font-size:14px;color:var(--sub);margin-left:5px}
.formula{
  margin-top:14px;
  font-size:12px;
  color:var(--sub);
  line-height:1.6;
}
@media(max-width:380px){
  h1{font-size:21px}
  .back{font-size:11px;padding:7px 8px}
  .field-row{grid-template-columns:1fr}
  .now-btn{width:100%}
}

/* ===== 時刻入力と現在時刻ボタンの重なり修正 ===== */
.field-row{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) 118px !important;
  gap:10px !important;
  align-items:end !important;
}
.field-row > *{
  min-width:0 !important;
}
#calcTime{
  width:100% !important;
  min-width:0 !important;
  max-width:100% !important;
}
.now-btn{
  width:118px !important;
  min-width:118px !important;
  max-width:118px !important;
  padding:0 8px !important;
  white-space:nowrap !important;
}

@media(max-width:420px){
  .field-row{
    grid-template-columns:minmax(0,1fr) 108px !important;
    gap:8px !important;
  }
  .now-btn{
    width:108px !important;
    min-width:108px !important;
    max-width:108px !important;
    font-size:13px !important;
  }
}


#progress{
  background:#fff;
}
.progress-note{
  margin-top:6px;
  color:var(--sub);
  font-size:12px;
}
.compare-wrap{
  margin-top:20px;
  border-top:1px solid var(--line);
  padding-top:18px;
}
.compare-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
.compare-table th,
.compare-table td{
  border:1px solid var(--line);
  text-align:center;
  padding:11px 6px;
  font-variant-numeric:tabular-nums;
}
.compare-table thead th{
  background:#f3f6f9;
  font-size:14px;
}
.compare-table thead th:first-child{
  background:#fff;
}
.compare-table tbody th{
  width:24%;
  background:#f8fafc;
  text-align:left;
  font-size:14px;
}
.compare-table td strong{
  font-size:22px;
}
.compare-table .target-col,
.compare-table .diff-col{
  display:none;
}
.compare-table.show-target .target-col,
.compare-table.show-target .diff-col{
  display:table-cell;
}
.diff-negative{color:#b42318}
.diff-positive{color:#1769aa}
@media(max-width:420px){
  .compare-table th,
  .compare-table td{
    padding:10px 4px;
  }
  .compare-table td strong{
    font-size:20px;
  }
}

</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <h1>現時点の出来高算出</h1>
    <a class="back" href="index.html">出来高計算へ戻る</a>
  </div>
  <div class="note">8:25から現在時刻までの実働時間で出来高と個当り工数を算出します。</div>

  <div class="card">
    <div class="field">
      <label for="calcTime">時刻</label>
      <div class="field-row">
        <input id="calcTime" type="time" step="60">
        <button id="nowBtn" class="now-btn" type="button">現在時刻</button>
      </div>
    </div>

    <div class="field">
      <label for="production">生産台数</label>
      <input id="production" type="number" inputmode="decimal" min="0" step="1" placeholder="入力">
    </div>

    <div class="field">
      <label for="progress">進度</label>
      <input id="progress" type="number" inputmode="numeric" step="1" placeholder="空欄OK">
      <div class="progress-note">例：-9 ＝ 9個遅れ、+5 ＝ 5個進み</div>
    </div>

    <div class="compare-wrap">
      <table class="compare-table">
        <thead>
          <tr>
            <th></th>
            <th>現時点</th>
            <th class="target-col">目標</th>
            <th class="diff-col">差</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>出来高</th>
            <td><strong id="rate">0.0</strong></td>
            <td class="target-col"><strong id="targetRate">－</strong></td>
            <td class="diff-col"><strong id="rateDiff">－</strong></td>
          </tr>
          <tr>
            <th>個当り</th>
            <td><strong id="unitTime">0.0</strong></td>
            <td class="target-col"><strong id="targetUnitTime">－</strong></td>
            <td class="diff-col"><strong id="unitDiff">－</strong></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="formula">
      現時点 ＝ 生産台数から算出<br>
      目標生産数 ＝ 生産台数 − 進度<br>
      ※進度が空欄の場合は「現時点」のみ表示<br>
      ※休憩時間は自動で除外
    </div>
  </div>
</div>

<script>
const SHIFT_START = 8*60+25;
const BREAKS = [
  ['08:15','08:25'],['10:15','10:25'],['12:15','13:00'],['15:00','15:10'],
  ['17:10','17:20'],['19:20','19:30'],['20:15','20:25'],['22:15','22:25'],
  ['00:15','01:00'],['03:00','03:10'],['05:10','05:20'],['07:20','07:30']
];

const calcTime=document.getElementById('calcTime');
const production=document.getElementById('production');
const progress=document.getElementById('progress');
const rate=document.getElementById('rate');
const unitTime=document.getElementById('unitTime');
const targetRate=document.getElementById('targetRate');
const targetUnitTime=document.getElementById('targetUnitTime');
const rateDiff=document.getElementById('rateDiff');
const unitDiff=document.getElementById('unitDiff');
const compareTable=document.querySelector('.compare-table');

const mins=t=>{
  if(!t) return NaN;
  const [h,m]=t.split(':').map(Number);
  return h*60+m;
};

function elapsedWithoutBreaks(start,end){
  let total=end-start,rest=0;
  for(let day=-1;day<=2;day++){
    for(const [a,b] of BREAKS){
      let bs=mins(a)+day*1440;
      let be=mins(b)+day*1440;
      if(be<=bs) be+=1440;
      rest+=Math.max(0,Math.min(end,be)-Math.max(start,bs));
    }
  }
  return Math.max(0,total-rest);
}

function endMinutesFromTime(v){
  if(!v) return NaN;
  let end=mins(v);
  while(end<=SHIFT_START) end+=1440;
  return end;
}

function trunc1(n){
  if(!Number.isFinite(n)) return "0.0";
  const corrected=Number(n.toFixed(10));
  return (Math.trunc(corrected*10)/10).toFixed(1);
}

function setDiffClass(el,n){
  el.classList.remove('diff-negative','diff-positive');
  if(!Number.isFinite(n)) return;
  if(n<0) el.classList.add('diff-negative');
  if(n>0) el.classList.add('diff-positive');
}

function calculate(){
  const qty=parseFloat(production.value);
  const progressRaw=progress.value.trim();
  const prog=progressRaw==='' ? NaN : parseFloat(progressRaw);
  const end=endMinutesFromTime(calcTime.value);
  const activeMin=Number.isFinite(end) ? elapsedWithoutBreaks(SHIFT_START,end) : 0;

  const validCurrent=Number.isFinite(qty) && qty>0 && activeMin>0;

  let currentRate=NaN;
  let currentUnit=NaN;

  if(validCurrent){
    currentRate=qty/activeMin*60;
    currentUnit=activeMin*60/qty;
    rate.textContent=trunc1(currentRate);
    unitTime.textContent=trunc1(currentUnit);
  }else{
    rate.textContent='0.0';
    unitTime.textContent='0.0';
  }

  const hasProgress=progressRaw!=='' && Number.isFinite(prog);
  compareTable.classList.toggle('show-target',hasProgress);

  if(!hasProgress){
    targetRate.textContent='－';
    targetUnitTime.textContent='－';
    rateDiff.textContent='－';
    unitDiff.textContent='－';
    return;
  }

  const targetQty=Number.isFinite(qty) ? qty-prog : NaN;

  if(!validCurrent || !Number.isFinite(targetQty) || targetQty<=0){
    targetRate.textContent='－';
    targetUnitTime.textContent='－';
    rateDiff.textContent='－';
    unitDiff.textContent='－';
    return;
  }

  const tRate=targetQty/activeMin*60;
  const tUnit=activeMin*60/targetQty;
  const dRate=currentRate-tRate;
  const dUnit=currentUnit-tUnit;

  targetRate.textContent=trunc1(tRate);
  targetUnitTime.textContent=trunc1(tUnit);
  rateDiff.textContent=trunc1(dRate);
  unitDiff.textContent=trunc1(dUnit);

  setDiffClass(rateDiff,dRate);
  setDiffClass(unitDiff,dUnit);
}

function setNow(){
  const d=new Date();
  calcTime.value=
    String(d.getHours()).padStart(2,'0')+':'+
    String(d.getMinutes()).padStart(2,'0');
  calculate();
}

document.getElementById('nowBtn').addEventListener('click',setNow);
calcTime.addEventListener('input',calculate);
production.addEventListener('input',calculate);
progress.addEventListener('input',calculate);
setNow();
</script>
</body>
</html>
