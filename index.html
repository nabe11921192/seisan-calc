<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>生産出来高計算</title>
<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#15171a;
  --sub:#667085;
  --line:#d9dee5;
  --accent:#1976d2;
  --result:#eef6ff;
  --calc-bg:#000;
  --calc-key:#333;
  --calc-fn:#6b6b6b;
  --calc-op:#ff9f0a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,input{touch-action:manipulation}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:24px 16px 40px;
}
h1{
  font-size:24px;
  margin:0 0 6px;
}
.note{
  color:var(--sub);
  font-size:13px;
  margin-bottom:18px;
}
.card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 16px rgba(0,0,0,.07);
}

/* 上部の通常電卓 */
.calc-toggle{
  width:100%;
  margin:0 0 16px;
  border:0;
  border-radius:12px;
  padding:13px 16px;
  font-size:16px;
  font-weight:800;
  background:#eaf3ff;
  color:#1769aa;
}
.calculator{
  display:none;
  margin-bottom:20px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#f8fafc;
}
.calculator.open{display:block}
.calc-display{
  width:100%;
  font-size:28px;
  font-weight:700;
  text-align:right;
  padding:14px 12px;
  margin-bottom:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  min-height:64px;
  overflow:hidden;
}
.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.calc-btn{
  margin:0;
  padding:14px 0;
  font-size:19px;
  font-weight:700;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:#222;
}
.calc-btn.op{
  background:#eef6ff;
  color:#1769aa;
}
.calc-btn.eq{
  background:#1976d2;
  color:#fff;
  border-color:#1976d2;
  grid-column:span 2;
}
.calc-btn.clear{
  grid-column:span 2;
  background:#eef1f5;
}

/* 生産計算 */
.field{margin-bottom:16px}
.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:16px;
}
.field-row .field{
  margin-bottom:0;
  min-width:0;
}
label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
  font-size:15px;
}
.inputrow{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}
input{
  width:100%;
  min-width:0;
  font-size:22px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  background:#fff;
  caret-color:transparent;
}
input.pad-active{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(25,118,210,.12);
}
.unit{
  flex:0 0 auto;
  color:var(--sub);
  font-size:14px;
}
.helper{
  margin-top:8px;
  font-size:12px;
  color:var(--sub);
}
.results{
  margin-top:20px;
  border-top:1px solid var(--line);
  padding-top:18px;
  display:grid;
  gap:12px;
}
.result{
  background:var(--result);
  border-radius:12px;
  padding:14px;
}
.result .name{
  font-size:14px;
  color:var(--sub);
  margin-bottom:4px;
}
.result .value{
  font-size:30px;
  font-weight:800;
  letter-spacing:.3px;
}
.result .suffix{
  font-size:14px;
  font-weight:500;
  color:var(--sub);
  margin-left:5px;
}
#clear{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:10px;
  padding:12px;
  font-size:16px;
  font-weight:700;
  background:#e9edf2;
  color:#30343a;
}
.formula{
  margin-top:14px;
  font-size:12px;
  color:var(--sub);
  line-height:1.6;
}
.error{
  display:none;
  margin-top:8px;
  font-size:12px;
  color:#b42318;
}
.error.show{display:block}

/* iPhone電卓風 入力テンキー */
body.pad-open{padding-bottom:500px}
.custom-pad{
  display:none;
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:9999;
  background:var(--calc-bg);
  padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 18px rgba(0,0,0,.22);
}
.custom-pad.open{display:block}
.pad-head{
  max-width:520px;
  margin:0 auto 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.pad-title{
  color:#fff;
  font-weight:800;
  font-size:15px;
  min-width:0;
}
.pad-expression{
  color:#aaa;
  font-size:13px;
  font-weight:600;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pad-close{
  flex:0 0 auto;
  border:0;
  border-radius:20px;
  background:#292929;
  color:#fff;
  padding:9px 15px;
  font-size:14px;
  font-weight:800;
}
.pad-grid{
  max-width:520px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.pad-btn{
  height:70px;
  border:0;
  border-radius:50%;
  background:var(--calc-key);
  color:#fff;
  font-size:29px;
  font-weight:500;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  -webkit-user-select:none;
}
.pad-btn.fn{background:var(--calc-fn)}
.pad-btn.op{background:var(--calc-op)}
.pad-btn.next{
  background:var(--calc-op);
  font-size:18px;
  font-weight:800;
}
.pad-btn:active{
  filter:brightness(1.35);
  transform:scale(.985);
}

@media(max-width:380px){
  .field-row{grid-template-columns:1fr}
  .pad-btn{height:64px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>生産出来高計算</h1>
  <div class="note">生産数・所要時間・停止時間・人員から自動計算します。</div>

  <div class="card">
    <button id="calcToggle" class="calc-toggle" type="button">電卓を開く</button>

    <div id="calculator" class="calculator">
      <div id="calcDisplay" class="calc-display">0</div>
      <div class="calc-grid">
        <button class="calc-btn clear" type="button" data-calc-action="clear">C</button>
        <button class="calc-btn" type="button" data-calc-action="back">⌫</button>
        <button class="calc-btn op" type="button" data-calc-value="÷">÷</button>

        <button class="calc-btn" type="button" data-calc-value="7">7</button>
        <button class="calc-btn" type="button" data-calc-value="8">8</button>
        <button class="calc-btn" type="button" data-calc-value="9">9</button>
        <button class="calc-btn op" type="button" data-calc-value="×">×</button>

        <button class="calc-btn" type="button" data-calc-value="4">4</button>
        <button class="calc-btn" type="button" data-calc-value="5">5</button>
        <button class="calc-btn" type="button" data-calc-value="6">6</button>
        <button class="calc-btn op" type="button" data-calc-value="-">−</button>

        <button class="calc-btn" type="button" data-calc-value="1">1</button>
        <button class="calc-btn" type="button" data-calc-value="2">2</button>
        <button class="calc-btn" type="button" data-calc-value="3">3</button>
        <button class="calc-btn op" type="button" data-calc-value="+">＋</button>

        <button class="calc-btn" type="button" data-calc-value="0">0</button>
        <button class="calc-btn" type="button" data-calc-value=".">.</button>
        <button class="calc-btn eq" type="button" data-calc-action="equals">＝</button>
      </div>
    </div>

    <div class="field">
      <label for="qty">生産数</label>
      <div class="inputrow">
        <input id="qty" type="text" inputmode="none" readonly placeholder="例：400">
        <span class="unit">個</span>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="minutes">所要時間</label>
        <div class="inputrow">
          <input id="minutes" type="text" inputmode="none" readonly placeholder="例：460">
          <span class="unit">分</span>
        </div>
      </div>

      <div class="field">
        <label for="stopMinutes">合計停止時間</label>
        <div class="inputrow">
          <input id="stopMinutes" type="text" inputmode="none" readonly placeholder="空欄OK">
          <span class="unit">分</span>
        </div>
      </div>
    </div>

    <div class="helper" id="effectiveTime">計算に使用する時間：－</div>
    <div class="error" id="timeError">停止時間は所要時間未満で入力してください。</div>

    <div class="field" style="margin-top:16px">
      <label for="people">人員</label>
      <div class="inputrow">
        <input id="people" type="text" inputmode="none" readonly placeholder="例：1">
        <span class="unit">人</span>
      </div>
    </div>

    <div class="results">
      <div class="result">
        <div class="name">出来高</div>
        <div class="value"><span id="output">－</span><span class="suffix">個/時</span></div>
      </div>

      <div class="result">
        <div class="name">個当り工数</div>
        <div class="value"><span id="labor">－</span><span class="suffix">秒/個</span></div>
      </div>
    </div>

    <button id="clear" type="button">入力をクリア</button>

    <div class="formula">
      停止時間が空欄：所要時間をそのまま使用<br>
      停止時間あり：所要時間 − 合計停止時間で計算<br><br>
      出来高 ＝ 生産数 ÷ 実稼働時間(分) × 60<br>
      個当り工数 ＝ 実稼働時間(分) × 60 × 人員 ÷ 生産数<br>
      ※表示は小数第2位を切り捨て
    </div>
  </div>
</div>

<div id="customPad" class="custom-pad" aria-hidden="true">
  <div class="pad-head">
    <div style="min-width:0">
      <div id="padTitle" class="pad-title">入力</div>
      <div id="padExpression" class="pad-expression"></div>
    </div>
    <button id="padClose" class="pad-close" type="button">閉じる</button>
  </div>

  <div class="pad-grid">
    <button class="pad-btn fn" type="button" data-pad="back">⌫</button>
    <button class="pad-btn fn" type="button" data-pad="clear">AC</button>
    <button class="pad-btn fn" type="button" data-pad="percent">%</button>
    <button class="pad-btn op" type="button" data-pad="÷">÷</button>

    <button class="pad-btn" type="button" data-pad="7">7</button>
    <button class="pad-btn" type="button" data-pad="8">8</button>
    <button class="pad-btn" type="button" data-pad="9">9</button>
    <button class="pad-btn op" type="button" data-pad="×">×</button>

    <button class="pad-btn" type="button" data-pad="4">4</button>
    <button class="pad-btn" type="button" data-pad="5">5</button>
    <button class="pad-btn" type="button" data-pad="6">6</button>
    <button class="pad-btn op" type="button" data-pad="−">−</button>

    <button class="pad-btn" type="button" data-pad="1">1</button>
    <button class="pad-btn" type="button" data-pad="2">2</button>
    <button class="pad-btn" type="button" data-pad="3">3</button>
    <button class="pad-btn op" type="button" data-pad="+">＋</button>

    <button class="pad-btn fn" type="button" data-pad="sign">±</button>
    <button class="pad-btn" type="button" data-pad="0">0</button>
    <button class="pad-btn" type="button" data-pad=".">.</button>
    <button id="padNext" class="pad-btn next" type="button" data-pad="next">次へ</button>
  </div>
</div>

<script>
const qty = document.getElementById('qty');
const minutes = document.getElementById('minutes');
const stopMinutes = document.getElementById('stopMinutes');
const people = document.getElementById('people');
const output = document.getElementById('output');
const labor = document.getElementById('labor');
const effectiveTime = document.getElementById('effectiveTime');
const timeError = document.getElementById('timeError');

function trunc1(n){
  if(!Number.isFinite(n)) return "－";
  const corrected = Number(n.toFixed(10));
  return (Math.trunc(corrected * 10) / 10).toFixed(1);
}

function calc(){
  const q = parseFloat(qty.value);
  const m = parseFloat(minutes.value);
  const s = stopMinutes.value === '' ? 0 : parseFloat(stopMinutes.value);
  const p = parseFloat(people.value);

  const validM = Number.isFinite(m) && m > 0;
  const validS = Number.isFinite(s) && s >= 0;
  const effective = validM && validS ? m - s : NaN;

  const invalidStop = validM && validS && effective <= 0;
  timeError.classList.toggle('show', invalidStop);

  if(Number.isFinite(effective) && effective > 0){
    effectiveTime.textContent = '計算に使用する時間：' + trunc1(effective) + '分';
  }else{
    effectiveTime.textContent = '計算に使用する時間：－';
  }

  if(invalidStop){
    output.textContent = '－';
    labor.textContent = '－';
    return;
  }

  const out = (q > 0 && effective > 0) ? q / effective * 60 : NaN;
  const lab = (q > 0 && effective > 0 && p > 0) ? effective * 60 * p / q : NaN;

  output.textContent = trunc1(out);
  labor.textContent = trunc1(lab);
}

/* 上部の通常電卓 */
const calcToggle = document.getElementById('calcToggle');
const calculator = document.getElementById('calculator');
const calcDisplay = document.getElementById('calcDisplay');
let calcExpr = '';

calcToggle.addEventListener('click', () => {
  calculator.classList.toggle('open');
  calcToggle.textContent = calculator.classList.contains('open') ? '電卓を閉じる' : '電卓を開く';
});

document.querySelectorAll('.calc-btn').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    const action = btn.dataset.calcAction;
    const value = btn.dataset.calcValue;

    if(action === 'clear'){
      calcExpr = '';
      calcDisplay.textContent = '0';
      return;
    }
    if(action === 'back'){
      calcExpr = calcExpr.slice(0,-1);
      calcDisplay.textContent = calcExpr || '0';
      return;
    }
    if(action === 'equals'){
      if(!calcExpr) return;
      try{
        const safe = calcExpr.replace(/×/g,'*').replace(/÷/g,'/');
        if(!/^[0-9+\-*/.() ]+$/.test(safe)) throw new Error();
        const result = Function('"use strict";return (' + safe + ')')();
        if(!Number.isFinite(result)) throw new Error();
        calcExpr = String(Number(result.toFixed(10)));
        calcDisplay.textContent = calcExpr;
      }catch{
        calcDisplay.textContent = 'エラー';
        calcExpr = '';
      }
      return;
    }
    if(value){
      calcExpr += value;
      calcDisplay.textContent = calcExpr;
    }
  });
});

/* 入力欄用 iPhone電卓風テンキー */
const customPad = document.getElementById('customPad');
const padTitle = document.getElementById('padTitle');
const padExpression = document.getElementById('padExpression');
const padClose = document.getElementById('padClose');
const padNext = document.getElementById('padNext');
const padInputs = [qty, minutes, stopMinutes, people];
const padNames = ['生産数を入力','所要時間を入力','合計停止時間を入力','人員を入力'];

let activeIndex = 0;
let expression = '';

function safeEval(expr){
  const safe = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  if(!/^[0-9+\-*/.() ]+$/.test(safe)) return NaN;
  try{
    const result = Function('"use strict";return (' + safe + ')')();
    return Number.isFinite(result) ? Number(result.toFixed(10)) : NaN;
  }catch{
    return NaN;
  }
}

function updatePadHeader(){
  padTitle.textContent = padNames[activeIndex];
  padExpression.textContent = expression;
  padNext.textContent = activeIndex === padInputs.length - 1 ? '完了' : '次へ';
}

function ensureActiveVisible(){
  requestAnimationFrame(() => {
    const el = padInputs[activeIndex];
    const padTop = customPad.getBoundingClientRect().top;
    const r = el.getBoundingClientRect();
    const safeTop = 90;
    const safeBottom = padTop - 18;

    if(r.bottom > safeBottom){
      window.scrollBy({top:r.bottom - safeBottom, behavior:'smooth'});
    }else if(r.top < safeTop){
      window.scrollBy({top:r.top - safeTop, behavior:'smooth'});
    }

    setTimeout(() => {
      const r2 = el.getBoundingClientRect();
      const padTop2 = customPad.getBoundingClientRect().top;
      if(r2.bottom > padTop2 - 18){
        window.scrollBy({top:r2.bottom - (padTop2 - 18), behavior:'auto'});
      }
    }, 180);
  });
}

function openPad(index){
  activeIndex = index;
  expression = '';
  customPad.classList.add('open');
  customPad.setAttribute('aria-hidden','false');
  document.body.classList.add('pad-open');
  padInputs.forEach((el,i) => el.classList.toggle('pad-active', i === activeIndex));
  updatePadHeader();
  ensureActiveVisible();
}

function finishExpression(){
  const el = padInputs[activeIndex];
  if(!expression) return true;

  let expr = expression;
  if(el.value !== ''){
    const last = expr.slice(-1);
    if(/[×÷−+]/.test(last)){
      expr += el.value;
    }
  }

  if(/[×÷−+]$/.test(expr)) return false;

  const result = safeEval(expr);
  if(!Number.isFinite(result)) return false;

  el.value = String(result);
  expression = '';
  el.dispatchEvent(new Event('input',{bubbles:true}));
  updatePadHeader();
  return true;
}

function closePad(){
  finishExpression();
  customPad.classList.remove('open');
  customPad.setAttribute('aria-hidden','true');
  document.body.classList.remove('pad-open');
  padInputs.forEach(el => el.classList.remove('pad-active'));
}

padInputs.forEach((el,i) => {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    openPad(i);
  });
});

padClose.addEventListener('pointerdown', e => {
  e.preventDefault();
  closePad();
});

document.querySelectorAll('[data-pad]').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();

    const key = btn.dataset.pad;
    const el = padInputs[activeIndex];
    let v = el.value;

    if(/^[0-9]$/.test(key)){
      if(v === '0') v = '';
      el.value = v + key;
      el.dispatchEvent(new Event('input',{bubbles:true}));
      if(expression){
        const parts = expression.split(/[×÷−+]/);
        updatePadHeader();
      }
      return;
    }

    if(key === '.'){
      if(!v.includes('.')){
        el.value = (v || '0') + '.';
        el.dispatchEvent(new Event('input',{bubbles:true}));
      }
      return;
    }

    if(key === 'back'){
      el.value = v.slice(0,-1);
      el.dispatchEvent(new Event('input',{bubbles:true}));
      return;
    }

    if(key === 'clear'){
      el.value = '';
      expression = '';
      el.dispatchEvent(new Event('input',{bubbles:true}));
      updatePadHeader();
      return;
    }

    if(key === 'sign'){
      if(v !== ''){
        el.value = v.startsWith('-') ? v.slice(1) : '-' + v;
        el.dispatchEvent(new Event('input',{bubbles:true}));
      }
      return;
    }

    if(key === 'percent'){
      if(v !== '' && Number.isFinite(Number(v))){
        el.value = String(Number(v) / 100);
        el.dispatchEvent(new Event('input',{bubbles:true}));
      }
      return;
    }

    if(/[×÷−+]/.test(key)){
      if(v === '') return;

      if(!expression){
        expression = v + key;
        el.value = '';
      }else{
        let expr = expression + v;
        const result = safeEval(expr);
        if(Number.isFinite(result)){
          expression = String(result) + key;
          el.value = '';
        }else{
          return;
        }
      }

      el.dispatchEvent(new Event('input',{bubbles:true}));
      updatePadHeader();
      return;
    }

    if(key === 'next'){
      if(!finishExpression()) return;
      calc();

      if(activeIndex < padInputs.length - 1){
        openPad(activeIndex + 1);
      }else{
        closePad();
      }
    }
  });
});

[qty,minutes,stopMinutes,people].forEach(el => el.addEventListener('input',calc));

document.getElementById('clear').addEventListener('pointerdown', e => {
  e.preventDefault();
  qty.value = '';
  minutes.value = '';
  stopMinutes.value = '';
  people.value = '';
  expression = '';
  calc();
  openPad(0);
});

/* 画面回転・表示領域変更時にも、入力欄がテンキーに隠れないよう再調整 */
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', () => {
    if(customPad.classList.contains('open')) ensureActiveVisible();
  });
}

calc();
</script>
</body>
</html>
